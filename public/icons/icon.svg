<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A88BFF"/>
      <stop offset="60%" stop-color="#7B5BE0"/>
      <stop offset="100%" stop-color="#FF7A45"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Wallet body -->
  <rect x="72" y="130" width="368" height="266" rx="40" fill="rgba(255,255,255,0.93)"/>
  <!-- Card peeking (tangerine) -->
  <rect x="140" y="194" width="232" height="120" rx="22" fill="#FF7A45"/>
  <!-- Eyes -->
  <circle cx="200" cy="172" r="16" fill="#1B1638"/>
  <circle cx="312" cy="172" r="16" fill="#1B1638"/>
  <!-- Smile -->
  <path d="M 210 210 Q 256 250 302 210" stroke="#1B1638" stroke-width="14" stroke-linecap="round" fill="none"/>
  <!-- Friendship beads (right wrist) -->
  <circle cx="398" cy="310" r="10" fill="#A88BFF"/>
  <circle cx="416" cy="324" r="10" fill="#FF7A45"/>
  <circle cx="426" cy="344" r="10" fill="#3FBF93"/>
  <!-- Bottom label -->
  <text x="256" y="455" font-family="-apple-system,sans-serif" font-weight="700" font-size="68" fill="rgba(255,255,255,0.92)" text-anchor="middle">BillBro</text>
</svg>
